<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub stats card">
<defs>

    <clipPath id="statsFrame"><rect width="480" height="200" rx="16"/></clipPath>
    <linearGradient id="ringGradS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2b3a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bgGradS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#160707"/>
    </linearGradient>
    <style>
      text { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
      .title { fill: #f5f5f5; font-size: 16px; font-weight: 700; }
      .label { fill: #9a9a9a; font-size: 12.5px; }
      .value { fill: #f5f5f5; font-size: 12.5px; font-weight: 700; }
      .rankval { fill: #f5f5f5; font-size: 26px; font-weight: 800; }
      .ranklbl { fill: #9a9a9a; font-size: 10px; letter-spacing: 1px; }
    </style>
    
</defs>
<g clip-path="url(#statsFrame)">
<rect width="480" height="200" fill="url(#bgGradS)"/>
<rect x="0.5" y="0.5" width="479" height="199" rx="15" fill="none" stroke="#2a2a2a"/>
<text x="20" y="30" class="title">Thimira’s GitHub Stats</text>
<circle cx="88" cy="122" r="52" fill="none" stroke="#2a2a2a" stroke-width="10"/>
<circle cx="88" cy="122" r="52" fill="none" stroke="url(#ringGradS)" stroke-width="10" stroke-linecap="round" transform="rotate(-90 88 122)" stroke-dasharray="326.7" stroke-dashoffset="326.7"><animate attributeName="stroke-dashoffset" from="326.7" to="45.7" begin="0.3s" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></circle>
<text x="88" y="130" text-anchor="middle" class="rankval">A+</text>
<text x="88" y="148" text-anchor="middle" class="ranklbl">RANK</text>
<g opacity="0" transform="translate(40,0)"><animate attributeName="opacity" values="0;1" begin="0.50s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="40,0;0,0" begin="0.50s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/><circle cx="176" cy="50" r="3.5" fill="#ff2b3a"/><text x="190" y="54" class="label">Total Stars</text><text x="456" y="54" text-anchor="end" class="value">128</text></g>
<g opacity="0" transform="translate(40,0)"><animate attributeName="opacity" values="0;1" begin="0.65s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="40,0;0,0" begin="0.65s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/><circle cx="176" cy="77" r="3.5" fill="#ff2b3a"/><text x="190" y="81" class="label">Total Commits</text><text x="456" y="81" text-anchor="end" class="value">1,842</text></g>
<g opacity="0" transform="translate(40,0)"><animate attributeName="opacity" values="0;1" begin="0.80s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="40,0;0,0" begin="0.80s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/><circle cx="176" cy="104" r="3.5" fill="#ff2b3a"/><text x="190" y="108" class="label">Total PRs</text><text x="456" y="108" text-anchor="end" class="value">54</text></g>
<g opacity="0" transform="translate(40,0)"><animate attributeName="opacity" values="0;1" begin="0.95s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="40,0;0,0" begin="0.95s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/><circle cx="176" cy="131" r="3.5" fill="#ff2b3a"/><text x="190" y="135" class="label">Total Issues</text><text x="456" y="135" text-anchor="end" class="value">31</text></g>
<g opacity="0" transform="translate(40,0)"><animate attributeName="opacity" values="0;1" begin="1.10s" dur="0.5s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="40,0;0,0" begin="1.10s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/><circle cx="176" cy="158" r="3.5" fill="#ff2b3a"/><text x="190" y="162" class="label">Contributed To</text><text x="456" y="162" text-anchor="end" class="value">19 repos</text></g>
</g>
</svg>